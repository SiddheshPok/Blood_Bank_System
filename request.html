<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Blood - Blood Bank</title>
    <link rel="stylesheet" href="request_style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
    <main class="main-content">
        <header class="top-nav">
            <button class="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <h1>Request Blood</h1>
        </header>

        <section class="form-section">
            <div class="form-container">
                <h2>Fill Patient Details</h2>
                <form class="request-form" onsubmit="submitRequest(event)">
                    <div class="form-group">
                        <label for="patientName">Patient Name</label>
                        <input type="text" id="patientName" name="name" placeholder="Enter patient's name" required />
                    </div>

                    <div class="form-group">
                        <label for="bloodGroup">Blood Group</label>
                        <select id="bloodGroup" name="blood_group" required>
                            <option value="">Select</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>O+</option>
                            <option>O-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="units">Units Required</label>
                        <input type="number" id="units" name="unit_required" placeholder="Enter number of units" required />
                    </div>

                    <div class="form-group">
                        <label for="hospital">Hospital Name</label>
                        <input type="text" id="hospital" name="hospital" placeholder="Enter hospital name" required />
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact Number</label>
                        <input type="tel" id="contact" name="contact" placeholder="Enter contact number" required />
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <textarea id="location" name="location" rows="3" placeholder="Enter location/address" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        function submitRequest(event) {
            event.preventDefault();
            const form = document.querySelector('.request-form');
            const formData = new FormData(form);

            fetch("add_request.php", {
                    method: "POST",
                    body: formData
                })
                .then(res => res.text())
                .then(data => {
                    if (data.trim() === "success") {
                        alert("Request submitted successfully!");
                        form.reset();
                    } else {
                        alert("Error: " + data);
                    }
                })
                .catch(err => {
                    alert("Failed: " + err);
                });

            return false;
        }
    </script>
</body>

</html>
